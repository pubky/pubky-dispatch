[package]
name = "pubky-switch-client"
description = "Client for apps that use a Pubky Switch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["http"]
# The HTTPS transport on reqwest and rustls, with the public-address resolver.
http = [
    "dep:reqwest", "dep:tokio", "dep:url", "dep:hyper", "dep:hyper-util",
    "dep:http-body-util", "dep:bytes", "dep:tokio-rustls", "dep:webpki-roots",
    "tokio?/net", "tokio?/time", "tokio?/io-util", "tokio?/macros",
]
# Runs each `StateStore` call through `tokio::task::spawn_blocking`, so a slow host store never
# blocks the async executor.
tokio = ["dep:tokio", "tokio?/rt", "tokio?/sync"]
# Test-only: the fault-injecting store, the scripted transport, the test clock, and the
# `testing` module with the scripted switch and its fixtures. No production build enables it;
# this crate's own tests turn it on through the dev-dependency below, and the tests of other
# crates through their dev-dependencies.
test-support = ["dep:blake3", "dep:ed25519-dalek", "pubky-switch-core/test-vectors"]

[dependencies]
bytes = { version = "1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
blake3 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
getrandom.workspace = true
pubky-switch-core.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
pubky-switch-client = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
